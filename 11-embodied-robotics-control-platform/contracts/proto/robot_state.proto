syntax = "proto3";

package embodied.robot_state.v1;

message Empty {}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message LinkPose {
  string link_name = 1;
  Vector3 position_m = 2;
  Quaternion orientation = 3;
}

message RobotState {
  string schema_version = 1;
  string run_id = 2;
  string robot_id = 3;
  string frame_id = 4;
  string clock_domain = 5;
  int64 simulation_time_ns = 6;
  int64 observed_wall_time_ns = 7;
  uint64 sequence = 8;
  string source = 9;
  string correlation_id = 10;
  repeated LinkPose links = 11;
}

message LoopEvent {
  string schema_version = 1;
  string run_id = 2;
  string robot_id = 3;
  string correlation_id = 4;
  string stage = 5;
  string status = 6;
  uint64 event_sequence = 7;
  int64 observed_wall_time_ns = 8;
  double observed_joint_radians = 9;
  double target_joint_radians = 10;
  string detail = 11;
  string clock_domain = 12;
  int64 simulation_time_ns = 13;
}

service RobotStateService {
  rpc Latest(Empty) returns (RobotState);
  rpc Watch(Empty) returns (stream RobotState);
  rpc WatchLoop(Empty) returns (stream LoopEvent);
}
